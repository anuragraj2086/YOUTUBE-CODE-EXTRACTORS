<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Code Extractor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎥 YouTube Code Extractor</h1>
        <p>Paste a YouTube tutorial URL to extract code with explanations</p>

        <div class="input-group">
            <input type="url" id="youtubeUrl" placeholder="https://www.youtube.com/watch?v=..." required>
            <button id="extractBtn">Extract Code</button>
        </div>

        <div id="loading" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Processing video...</p>
        </div>

        <div id="output" class="output-section">
            <h2>Extracted Code</h2>
            <div id="codeOutput" class="code-output"></div>
            <button id="downloadBtn" class="btn-secondary" style="display: none;">Download Code</button>
        </div>

        <div id="error" class="error-message" style="display: none;"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
